/* ---------- Transparent scoring ---------- */
function score(it){
 const base={available:78,low:45,out:0}[it.st];
 const rec=it.hrs<=2?15:it.hrs<=6?8:it.hrs<=24?0:it.hrs<=48?-10:-20;
 const ord=-Math.min(12,it.orders), can=-Math.min(15,it.canc*5), sub=-Math.min(8,it.subs*2);
 const parts=[
  ["Stock status: "+({available:"available",low:"low stock",out:"out of stock"}[it.st]),base],
  ["Last updated "+(it.hrs<1?"just now":it.hrs+"h ago"),rec],
  ["Recent orders ("+it.orders+" in last hour)",ord],
  ["Recent cancellations ("+it.canc+")",can],
  ["Recent substitutions ("+it.subs+")",sub]];
 let s=Math.max(0,Math.min(100,parts.reduce((a,p)=>a+p[1],0)));
 if(it.st==="out")s=Math.min(s,8);
 return{s,parts};
}
const sc=it=>score(it).s;
const lvl=s=>s>=80?"hi":s>=50?"md":"lo";
const lvlName=s=>s>=80?"High availability":s>=50?"Medium availability":"Limited availability";
const storeName=s=>s>=80?"High":s>=50?"Limited":s>=30?"Low":"Critical";
const col=l=>`var(--${l})`;
function ring(s,size=64){const r=26,c=2*Math.PI*r,l=lvl(s);
 return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" role="img" aria-label="${s}% availability confidence"><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--line)" stroke-width="7"/><circle cx="32" cy="32" r="${r}" fill="none" stroke="${col(l)}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${(c*s/100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 32 32)"/><text x="32" y="37" text-anchor="middle" font-size="16" font-weight="800" fill="var(--ink)" font-family="Bricolage Grotesque,sans-serif">${s}%</text></svg>`}
const stLabel=it=>({available:"In stock",low:"Low stock",out:"Out of stock"}[it.st]);
const byId=id=>items.find(i=>i.id===id);

function runTests(){
 const a=byId(1),old=a.st;
 const out={...a,st:"out"},low={...a,st:"low"},av={...a,st:"available"};
 const alt=alts(low).length>0;
 tests=[
  ["Product search",groups().length>0],
  ["Availability logic",canOrder(av)&&canOrder(low)&&!canOrder(out)],
  ["Low-stock detection",statusText(low)==="Low Availability"],
  ["Alternative recommendation",alt],
  ["Cart update",Array.isArray(cart)],
  ["Order completion",typeof checkout==="function"],
  ["Reward-point calculation",rewardPoints>=0],
  ["Coupon eligibility",wallet.some(w=>w.code==="RETURN15")||totalOrders===0],
  ["Store inventory update",typeof setStock==="function"],
  ["Customer/store synchronization",availabilityOf(a)===old]
 ].map(([name,pass])=>({name,pass:Boolean(pass)}));
 return tests;
}
function testingCard(){
 const r=runTests(),pass=r.filter(x=>x.pass).length;

}

/* ---------- Customer ---------- */
function groups(){
 const t=q.toLowerCase().split(/\s+/).filter(Boolean);if(!t.length&&dept==="all")return[];
 const m=items.filter(i=>(dept==="all"||DEPT_OF[i.cat]===dept)&&t.every(w=>(i.name+" "+i.cat).toLowerCase().includes(w)));
 const g={};m.forEach(i=>{if(!g[i.name]||(isPh(i)?sc(i)>sc(g[i.name]):STORES[i.store].eta<STORES[g[i.name].store].eta))g[i.name]=i});
 return Object.values(g);
}
function alts(it){

  .sort((a,b)=>sc(b)-sc(a)).slice(0,3);
}

  ${showAlts&&a.length?`<div class="alts"><b>Smart Alternatives</b>${a.map(o=>{const os=sc(o),same=o.name===it.name;return `<div class="alt">${ring(os,48)}<div class="info"><b>${esc(o.name)}</b><div class="meta">${same?"Same product, other store":"Alternative product"} · ${esc(STORES[o.store].n)} · ${STORES[o.store].eta} min · ₹${o.price}</div></div><button class="btn ghost" onclick="replaceWithAlternative(${o.id},${it.id})">Choose instead</button></div>`}).join("")}</div>`:""}
  ${showAlts&&!a.length?`<div class="meta" style="margin-top:8px">No available alternatives right now.</div>`:""}
 </div>`;

function customer(){

 return `<div class="grid"><div class="stack">

 <div><form class="search" onsubmit="event.preventDefault();q=document.getElementById('q').value;render()"><input id="q" value="${esc(q)}" placeholder="Search milk, eggs, bread, biscuits" aria-label="Search products"><button class="btn" type="submit">Search</button></form>

 </div>${cartPanel()}</div>`;
}
const isPh=i=>DEPT_OF[i.cat]==="pharmacy";
const csc=i=>isPh(i)?Math.max(85,sc(i)):sc(i);
const etaOf=i=>STORES[i.store].eta+(isPh(i)&&sc(i)<50?8:0);
const cdesc=c=>c.type==="flat"?`₹${c.val} off above ₹${c.min}`:c.type==="pct"?`${c.val}% off, up to ₹${c.cap}, min ₹${c.min}`:c.type==="ship"?"Free delivery on any order":c.type==="combo"?`₹${c.val} off + free delivery above ₹${c.min}`:`₹${c.val} off when you accept a SmartStock swap`;
function valid(c,sub){if(sub<c.min)return`Add ₹${c.min-sub} more`;if(c.type==="swap"&&!cart.some(x=>x.from))return"Needs a swapped-in item";return true}
function calc(){
 const sub=cart.reduce((a,c)=>a+byId(c.id).price,0);let fee=cart.length?FEE:0,disc=0,ok=false;
 const c=wallet.find(w=>w.id===applied);
 if(c&&valid(c,sub)===true){ok=true;if(c.type==="ship")fee=0;else if(c.type==="combo"){fee=0;disc=Math.min(c.val,sub)}else if(c.type==="pct")disc=Math.min(c.cap,Math.round(sub*c.val/100));else disc=Math.min(c.val,sub)}
 return{sub,fee,disc,ok,c,saved:disc+(ok&&(c.type==="ship"||c.type==="combo")?FEE:0),total:sub+fee-disc}
}
function route(compact){

 return `<div class="card route-card"><b>${compact?"Reward route":"Orders this round"}: ${n}/5</b><div class="route">${h}</div><div class="meta">${msg}${n>=3?` <button class="link" onclick="setMode('r')">Spin now</button>`:""}</div></div>`;
}

function add(id,from){
 const it=byId(id);if(!it||!canOrder(it)){toast("This product is unavailable.");return}
 cart.push({id,from:from||null});toast(it.name+" added to cart");render()
}
function replaceWithAlternative(id,from){

 toast(it.name+" selected as the alternative");render()
}
function checkout(){
 if(!cart.length)return;

 ${orders>=3?`<button class="btn" onclick="dlg.close();setMode('r')">Spin the wheel</button> `:""}<button class="btn ghost" onclick="dlg.close();setMode('r')">Review &amp; earn</button> <button class="btn ghost" onclick="dlg.close()">Done</button>`;
 dlg.showModal();render();
}

  <button class="btn" onclick="sendThanks()">Send thanks${o.tipAmt?` · ₹${o.tipAmt}`:""}</button></div>`;
 }
 return `<div class="card route-card" style="border-left-color:${late?"var(--lo)":"var(--hi)"}"><div class="row"><b>🛵 Your order is on the way</b><span class="tag ${late?"lo":"hi"}">${late?"Delayed":"On time"}</span></div>
 <div class="meta" style="margin:4px 0">Promised: ${o.eta} min · Now: ${o.eta+o.delay} min${o.delay?` (+${o.delay})`:""}</div>
 <div class="row"><span>Order total ₹${o.paid}</span><b class="${r.amt?"pos":""}">${r.amt?`Price now ₹${final} (−₹${r.amt})`:`You pay ₹${o.paid}`}</b></div>
 <div class="meta">${r.txt}</div>
 <div style="margin-top:6px"><button class="link" onclick="delay(5)">Demo: add 5 min delay</button> · <button class="link" onclick="delay(0)">Reset</button> · <button class="link" onclick="deliver()">Demo: mark delivered</button></div></div>`;
}
function reviewNudge(){
 const o=lastOrder;if(!o||(o.msg&&o.vid))return"";
 return `<div class="card route-card"><b>Review your last order and earn a reward</b><div class="meta">Message: ₹15 off · Promo video: ₹40 off + free delivery, on your next order. <button class="link" onclick="setMode('r')">Review now</button></div></div>`;
}
function setStars(n){stars=n;document.querySelectorAll(".star").forEach((b,i)=>b.classList.toggle("on",i<n))}
function submitMsg(){
 const t=document.getElementById("rtext").value.trim();
 if(!stars){toast("Pick a star rating first");return}
 if(t.length<20){toast(`Write at least 20 characters (${t.length}/20)`);return}
 lastOrder.msg=true;stars=0;
 wallet.push({id:Date.now(),code:"REVIEW15",type:"flat",val:15,min:99});
 toast("Review sent. REVIEW15 added to your wallet");render();
}
function pickVideo(inp){
 const f=inp.files[0],m=document.getElementById("vmsg"),b=document.getElementById("vbtn"),v=document.getElementById("vprev");
 vidOk=false;b.disabled=true;v.style.display="none";
 if(!f)return;
 if(!f.type.startsWith("video/")){m.textContent="Choose a video file.";return}
 if(f.size>50*1048576){m.textContent="Video must be under 50 MB.";return}
 if(vurl)URL.revokeObjectURL(vurl);vurl=URL.createObjectURL(f);
 v.src=vurl;v.style.display="block";m.textContent="Checking video…";
 v.onloadedmetadata=()=>{const d=v.duration;if(d<5||d>60){m.textContent=`Video is ${Math.round(d)}s. Keep it between 5 and 60 seconds.`;return}vidOk=true;b.disabled=false;m.textContent=`Ready: ${Math.round(d)}s clip.`};
 v.onerror=()=>{m.textContent="This video can't be played. Try an MP4."};
}
function submitVideo(){
 if(!vidOk)return;
 lastOrder.vid=true;vidOk=false;
 wallet.push({id:Date.now(),code:"VIDEO40",type:"combo",val:40,min:149});
 toast("Video submitted. VIDEO40 added to your wallet");render();
}
function reviewCard(){
 const o=lastOrder;
 if(!o)return `<div class="card"><h2 style="font-size:20px">Review &amp; earn</h2><p class="meta">Place an order, then review it with a message (₹15 off) or a short promo video (₹40 off + free delivery) on your next order.</p></div>`;
 return `<div class="card"><h2 style="font-size:20px">Review &amp; earn</h2><p class="meta">Reviewing your last order: ${o.names.join(", ")}. Rewards go to your wallet for your next order.</p>
 <div class="rv"><div class="opt"><h3>Message review</h3><span class="reward">₹15 off</span>
 ${o.msg?`<p class="done">✅ Review sent. REVIEW15 is in your wallet.</p>`:`<div role="group" aria-label="Star rating">${[1,2,3,4,5].map(n=>`<button class="star ${stars>=n?"on":""}" aria-label="${n} star${n>1?"s":""}" onclick="setStars(${n})">★</button>`).join("")}</div>
 <textarea id="rtext" aria-label="Your review" placeholder="Was everything available as promised? Tell others (20+ characters)"></textarea>
 <button class="btn" onclick="submitMsg()">Send review</button>`}</div>
 <div class="opt"><h3>Promo video</h3><span class="reward">₹40 off + free delivery</span>
 ${o.vid?`<p class="done">✅ Video submitted. VIDEO40 is in your wallet.</p>`:`<p class="meta" style="margin:6px 0">Show the product or your delivery. 5 to 60 seconds, under 50 MB.</p>
 <input type="file" accept="video/*" aria-label="Choose a promo video" onchange="pickVideo(this)">
 <video id="vprev" controls playsinline></video><div class="meta" id="vmsg" aria-live="polite"></div>
 <button class="btn" id="vbtn" style="margin-top:8px" onclick="submitVideo()" disabled>Submit video</button>`}</div></div>
 <p class="meta" style="margin-top:10px">Prototype note: the video stays on your device. A live version would upload it for moderation before issuing the reward.</p></div>`;
}
function rewards(){
 const ready=orders>=3;
 return `<div class="grid"><div class="stack">${route(false)}
  <div class="card"><h2 style="font-size:20px">Rewards & Returning Customer Value</h2>
   <div class="business-grid"><div class="kpi"><b>${rewardPoints}</b><small>Current points</small></div><div class="kpi"><b>+${latestPoints}</b><small>Latest order points</small></div><div class="kpi"><b>${totalOrders}</b><small>Total simulated orders</small></div><div class="kpi"><b>${repeatBonus}</b><small>Returning-customer bonus</small></div></div>
   <p class="meta" style="margin-top:10px">Prototype rule: first order earns +10 points; later purchases earn an additional +20 repeat bonus.</p>
  </div>${reviewCard()}
 <div class="card" style="text-align:center"><h2 style="font-size:22px">Lucky draw</h2><p class="meta">Every order moves you along the route. Spin once you reach order 3. Every spin wins a coupon.</p>
 <div class="wheelbox"><div class="pointer"></div><div class="wheel" id="wheel" style="transform:rotate(${rot}deg)">${PRIZES.map((p,i)=>`<span style="transform:rotate(${i*60+30}deg) translateY(-90px)${i===2||i===3?" rotate(180deg)":""}">${p.t}</span>`).join("")}</div><div class="hub">🎁</div></div>
 ${lastWin?`<div class="win">🎉 You won ${lastWin.t}! ${lastWin.code} is in your wallet.</div>`:""}
 <button class="btn" id="spinbtn" onclick="spin()" ${ready?"":"disabled"}>${ready?"Spin the wheel":`Unlocks in ${3-orders} order${3-orders>1?"s":""}`}</button>
 <div style="margin-top:10px"><button class="link" onclick="orders=Math.min(5,orders+1);render()">Demo: count one more order</button></div></div></div>
 <aside class="card"><h2 style="font-size:20px">Coupon wallet</h2>${wallet.length?wallet.map(w=>`<div class="tkt"><b>${w.code}</b>${applied===w.id?` <span class="tag hi">Applied</span>`:""}<div class="meta">${cdesc(w)}</div></div>`).join(""):`<p class="meta">Empty. Place orders to unlock the lucky draw.</p>`}<p class="meta" style="margin-top:12px">Apply a coupon from your cart. SWAPSAVE rewards you for choosing a SmartStock alternative.</p></aside></div>`;
}
/* ---------- Store ---------- */
function store(){return liveDelivery()+storeMain()+businessImpact()+testingCard()+pharmDesk()}
function storeMain(){
 const mine=items.filter(i=>i.store===MY),need=mine.filter(i=>sc(i)<50);
 const avg=Math.round(mine.reduce((a,i)=>a+sc(i),0)/mine.length);
 return `<div class="tiles"><div class="card tile"><b>${avg}%</b>Average inventory health</div><div class="card tile"><b style="color:${need.length?"var(--lo)":"var(--hi)"}">${need.length}</b>Need your attention</div><div class="card tile"><b>${prevented}</b>Failed orders prevented</div></div>
 <div class="card" style="margin-bottom:16px"><h2 style="font-size:20px">Needs Your Attention</h2>
 <p class="meta" style="margin:4px 0 8px">Change Available → Low Stock → Unavailable here. The same item state is immediately used by Customer Mode.</p>
 ${need.length?need.map(i=>`<div style="padding:10px 0;border-top:1px solid var(--line)"><div class="row"><div><b>${i.name}</b><div class="meta">Current confidence: <b class="neg">${sc(i)}%</b> · last updated ${i.hrs}h ago</div></div><button class="btn" onclick="editing=${i.id};render()">Update Stock</button></div>${picker(i)}</div>`).join(""):`<p style="color:var(--hi);font-weight:600">All clear. Nothing needs you right now.</p>`}</div>
 <div class="card"><h2 style="font-size:20px">Inventory Health</h2><label class="meta">Viewing store <select onchange="MY=this.value;editing=null;render()">${Object.keys(STORES).map(k=>`<option value="${k}" ${k===MY?"selected":""}>${STORES[k].n}</option>`).join("")}</select></label>
 ${mine.map(i=>{const s=sc(i),l=lvl(s);return `<div style="border-top:1px solid var(--line)"><div class="inv" style="border:0"><b>${EMO[i.cat]} ${i.name}</b><div class="bar" aria-hidden="true"><i style="width:${s}%;background:${col(l)}"></i></div><span><b>${s}%</b> <span class="tag ${l}">${storeName(s)}</span></span><button class="link" onclick="why(${i.id})">Why?</button></div>${editing===i.id&&sc(i)>=50?picker(i):""}${editing!==i.id?`<button class="link" style="margin:0 0 8px" onclick="editing=${i.id};render()">Update stock</button>`:""}</div>`}).join("")}</div>`;
}
function picker(i){
 if(editing!==i.id)return"";
 return `<div class="picker" role="group" aria-label="Set stock for ${i.name}">${[["available","Available"],["low","Low Stock"],["out","Out of Stock"]].map(o=>`<button onclick="setStock(${i.id},'${o[0]}')">${o[1]}</button>`).join("")}<button class="link" onclick="editing=null;render()">Cancel</button></div>`;
}
function setStock(id,st){
 const i=byId(id),b=sc(i);i.st=st;i.hrs=0;editing=null;
 toast(`${i.name}: ${stLabel({st})}. Customer Mode is updated.`);render();
}

/* ---------- Shared ---------- */
function why(id,c){
 const i=byId(id),r=score(i);if(c&&isPh(i)&&r.s<85){r.parts.push(["Nova pharmacy guarantee (best partner pharmacy)",85-r.s]);r.s=85}const l=lvl(r.s);
 dlg.innerHTML=`<h2>${i.name}</h2><p style="margin:4px 0 12px"><span class="tag ${l}">${r.s}% · ${lvlName(r.s)}</span></p>
 <b>Why this score?</b><table>${r.parts.map(p=>`<tr><td>${p[0]}</td><td class="${p[1]>=0?"pos":"neg"}">${p[1]>0?"+":""}${p[1]}</td></tr>`).join("")}<tr><td><b>Total (0–100)</b></td><td>${r.s}${i.st==="out"?" (capped: out of stock)":""}</td></tr></table>
 <p class="meta">Rule-based prototype: stock status sets the base, then recency, order activity, cancellations and substitutions adjust it. 80+ is High, 50–79 Medium, below 50 Low.</p>
 <button class="btn" onclick="dlg.close()">Close</button>`;
 dlg.showModal();
}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2500)}
function setMode(m){if(role!=="store"&&m==="s")return;mode=m;editing=null;render()}
function setRole(r){role=r;if(r!=="store"&&mode==="s")mode="c";render()}
function pharmDesk(){
 const ph=items.filter(isPh).sort((a,b)=>sc(a)-sc(b)),low=ph.filter(i=>sc(i)<50).length,nf=NET.filter(x=>x.dept==="pharmacy"&&x.h<50).length;
 return `<div class="card" style="margin-top:16px"><h2 style="font-size:20px">Company pharmacy desk</h2>
 <p class="meta" style="margin:4px 0 8px">24/7 pharmacy desk routing is simulated for this prototype. Stock can still be marked unavailable; the desk provides a restock workflow. ${low?`<b class="neg">${low} item${low>1?"s":""} need a stock update.</b>`:"All pharmacy items are healthy."} ${nf} of 120 local pharmacy stores are flagged.</p>
 <button class="btn" onclick="restockPharm()">Restock all low pharmacy items</button>
 ${ph.map(i=>{const s=sc(i),l=lvl(s);return `<div style="border-top:1px solid var(--line);margin-top:10px"><div class="inv" style="border:0"><div><b>${EMO[i.cat]} ${i.name}</b><div class="meta">${STORES[i.store].n}</div></div><div class="bar" aria-hidden="true"><i style="width:${s}%;background:${col(l)}"></i></div><span><b>${s}%</b> <span class="tag ${l}">${storeName(s)}</span></span><button class="btn ghost" style="padding:6px 12px" onclick="editing=${i.id};render()">Update stock</button></div>${editing===i.id?picker(i):""}</div>`}).join("")}</div>`;
}
function restockPharm(){
 let n=0;items.filter(i=>isPh(i)&&sc(i)<50).forEach(i=>{i.st="available";i.hrs=0;n++});
 NET.filter(x=>x.dept==="pharmacy"&&x.h<50).forEach(x=>{x.h=78;n++});
 toast(n?`Restocked ${n} pharmacy record${n>1?"s":""}`:"Nothing to restock");render();
}
function network(){
 const f=NET.filter(x=>(svc.city==="all"||x.city===svc.city)&&(svc.dept==="all"||x.dept===svc.dept)&&(!svc.q||(x.name+" "+x.area).toLowerCase().includes(svc.q.toLowerCase())));
 const avg=a=>Math.round(a.reduce((t,x)=>t+x.h,0)/a.length);
 return `<div class="card status-note" style="margin-bottom:12px">620 local stores across Vijayawada, Visakhapatnam and Guntur are prototype/case data, not verified real stores.</div><div class="tiles"><div class="card tile"><b>${NET.length}</b>Local stores</div><div class="card tile"><b>3</b>Cities</div><div class="card tile"><b>${avg(NET)}%</b>Network inventory health</div>${role==="store"?`<div class="card tile"><b style="color:var(--lo)">${NET.filter(x=>x.h<50).length}</b>Stores flagged for attention</div>`:`<div class="card tile"><b>${Math.round(NET.reduce((t,x)=>t+x.eta,0)/NET.length)} min</b>Average delivery time</div>`}</div>
 <div class="card" style="margin-bottom:16px"><h2 style="font-size:20px">Stores by category</h2>${Object.entries(DEPTS).map(([k,d])=>{const a=NET.filter(x=>x.dept===k),h=avg(a);return `<div class="inv"><b>${d.e} ${d.n}</b><div class="bar" aria-hidden="true"><i style="width:${d.c/620*100}%;background:var(--brand)"></i></div><span><b>${d.c}</b> stores</span><span class="meta">${h}% avg health</span></div>`}).join("")}</div>
 <div class="card"><h2 style="font-size:20px">Browse stores</h2><div class="f">
 <select aria-label="City" onchange="svc.city=this.value;svc.lim=12;render()"><option value="all">All cities</option>${Object.keys(AREAS).map(c=>`<option ${svc.city===c?"selected":""}>${c}</option>`).join("")}</select>
 <select aria-label="Category" onchange="svc.dept=this.value;svc.lim=12;render()"><option value="all">All categories</option>${Object.entries(DEPTS).map(([k,d])=>`<option value="${k}" ${svc.dept===k?"selected":""}>${d.n}</option>`).join("")}</select>
 <input aria-label="Search stores" placeholder="Search name or area" value="${esc(svc.q)}" onchange="svc.q=this.value;svc.lim=12;render()"></div>
 <p class="meta">${f.length} store${f.length===1?"":"s"}</p>
 ${f.slice(0,svc.lim).map(x=>{const l=lvl(x.h);return `<div class="inv"><div><b>${DEPTS[x.dept].e} ${x.name}</b><div class="meta">${x.area}, ${x.city} · ${x.eta} min</div></div><div class="bar" aria-hidden="true"><i style="width:${x.h}%;background:${col(l)}"></i></div><span><b>${x.h}%</b> <span class="tag ${l}">${storeName(x.h)}</span></span><span class="meta">${DEPTS[x.dept].n}</span></div>`}).join("")}
 ${f.length>svc.lim?`<button class="btn ghost" style="margin-top:10px" onclick="svc.lim+=12;render()">Show 12 more</button>`:""}</div>`;
}
function render(){
 ["c","n","r","s"].forEach(m=>document.getElementById("t-"+m).setAttribute("aria-selected",mode===m));
 document.getElementById("t-s").style.display=role==="store"?"":"none";const rs=document.getElementById("role");if(rs)rs.value=role;
 document.getElementById("prev").textContent=prevented+" cancellation"+(prevented===1?"":"s")+" prevented";
 document.getElementById("app").innerHTML={c:customer,n:network,r:rewards,s:store}[mode]();
}
const dlg=document.getElementById("dlg");
render();
</script></body></html>
